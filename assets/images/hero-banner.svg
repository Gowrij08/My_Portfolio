<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b69;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4c1d95;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdbcb4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8a085;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="laptopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="350" fill="url(#bgGradient)" rx="12" ry="12"/>

  <!-- Desk/Table -->
  <rect x="50" y="220" width="400" height="20" fill="#8b4513" rx="2"/>
  <rect x="50" y="240" width="400" height="8" fill="#654321"/>

  <!-- Laptop Base -->
  <rect x="180" y="200" width="140" height="8" fill="url(#laptopGradient)" rx="2"/>
  <rect x="190" y="195" width="120" height="5" fill="url(#laptopGradient)"/>

  <!-- Laptop Screen -->
  <rect x="200" y="120" width="100" height="75" fill="url(#laptopGradient)" rx="3"/>
  <rect x="205" y="125" width="90" height="65" fill="url(#screenGradient)" rx="2"/>

  <!-- Laptop Hinge -->
  <rect x="295" y="195" width="5" height="5" fill="#6b7280" rx="1"/>

  <!-- Screen Content (Code) -->
  <rect x="210" y="135" width="80" height="2" fill="#10b981" rx="1"/>
  <rect x="210" y="145" width="60" height="2" fill="#3b82f6" rx="1"/>
  <rect x="210" y="155" width="70" height="2" fill="#8b5cf6" rx="1"/>
  <rect x="210" y="165" width="50" height="2" fill="#ef4444" rx="1"/>
  <rect x="210" y="175" width="75" height="2" fill="#f59e0b" rx="1"/>

  <!-- Woman -->
  <!-- Hair -->
  <ellipse cx="320" cy="140" rx="25" ry="35" fill="url(#hairGradient)"/>
  <ellipse cx="315" cy="125" rx="20" ry="25" fill="url(#hairGradient)"/>

  <!-- Face -->
  <circle cx="320" cy="155" r="18" fill="url(#skinGradient)"/>

  <!-- Eyes -->
  <circle cx="312" cy="150" r="2" fill="#2d3748"/>
  <circle cx="328" cy="150" r="2" fill="#2d3748"/>
  <circle cx="313" cy="149" r="0.8" fill="#ffffff"/>
  <circle cx="329" cy="149" r="0.8" fill="#ffffff"/>

  <!-- Nose -->
  <ellipse cx="320" cy="158" rx="1" ry="2" fill="#d4a574"/>

  <!-- Mouth -->
  <path d="M 315 165 Q 320 168 325 165" stroke="#c53030" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="315" y="173" width="10" height="15" fill="url(#skinGradient)" rx="5"/>

  <!-- Shirt -->
  <path d="M 305 185 Q 320 175 335 185 L 340 220 L 300 220 Z" fill="#8b5cf6"/>
  <path d="M 305 185 L 300 220 L 305 220 L 310 200 Z" fill="#7c3aed"/>
  <path d="M 335 185 L 340 220 L 335 220 L 330 200 Z" fill="#7c3aed"/>

  <!-- Arms -->
  <ellipse cx="295" cy="200" rx="8" ry="25" fill="url(#skinGradient)" transform="rotate(-15 295 200)"/>
  <ellipse cx="345" cy="200" rx="8" ry="25" fill="url(#skinGradient)" transform="rotate(15 345 200)"/>

  <!-- Hands -->
  <circle cx="290" cy="220" r="6" fill="url(#skinGradient)"/>
  <circle cx="350" cy="220" r="6" fill="url(#skinGradient)"/>

  <!-- Coffee Mug -->
  <ellipse cx="120" cy="210" rx="12" ry="8" fill="#8b4513"/>
  <rect x="108" y="202" width="24" height="20" fill="#8b4513" rx="2"/>
  <ellipse cx="120" cy="202" rx="12" ry="3" fill="#654321"/>
  <rect x="115" y="195" width="10" height="8" fill="#d4a574" rx="1"/>
  <circle cx="125" cy="208" r="1" fill="#ffffff" opacity="0.7"/>

  <!-- Steam from coffee -->
  <path d="M 118 195 Q 116 190 118 185" stroke="#e5e7eb" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 122 195 Q 124 190 122 185" stroke="#e5e7eb" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Table Plant -->
  <rect x="380" y="180" width="8" height="40" fill="#8b4513"/>
  <ellipse cx="384" cy="175" rx="15" ry="12" fill="#166534"/>
  <ellipse cx="378" cy="170" rx="12" ry="10" fill="#15803d"/>
  <ellipse cx="390" cy="172" rx="10" ry="8" fill="#16a34a"/>
  <circle cx="382" cy="168" r="2" fill="#fbbf24"/>
  <circle cx="388" cy="175" r="1.5" fill="#fbbf24"/>
  <circle cx="376" cy="172" r="1.5" fill="#fbbf24"/>

  <!-- Plant Pot -->
  <ellipse cx="384" cy="220" rx="10" ry="5" fill="#92400e"/>
  <rect x="374" y="215" width="20" height="8" fill="#92400e" rx="2"/>

  <!-- Floating Code Elements -->
  <g opacity="0.3">
    <text x="80" y="100" font-family="monospace" font-size="10" fill="#10b981">function</text>
    <text x="80" y="115" font-family="monospace" font-size="10" fill="#3b82f6">const data</text>
    <text x="80" y="130" font-family="monospace" font-size="10" fill="#8b5cf6">import AI</text>
  </g>

  <!-- Professional Label -->
  <text x="250" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" opacity="0.8">AI Engineering & Data Science</text>
</svg>